<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONEID 계정</title>
  <link rel="stylesheet" href="style.css?v=20261028b">
</head>
<body>
  <header class="topbar"><a class="brand" href="/">ONEID</a><nav><a href="https://oneid-helpdesk.onrender.com" target="_blank" rel="noopener">고객센터</a><a id="adminNavLink" href="/admin.html" hidden>총괄관리자</a><button id="logout" class="link-button" type="button">로그아웃</button></nav></header>
  <main class="form-wrap"><section class="card">
    <p class="eyebrow">YOUR ONEID</p><h1>계정 정보</h1>
    <dl id="profile" class="profile" hidden><dt>사용자명</dt><dd id="username"></dd><dt>닉네임</dt><dd id="nickname"></dd><dt>권한</dt><dd id="role"></dd></dl>

    <form id="nicknameForm" style="margin: 18px 0 12px; padding-top: 16px; border-top: 1px solid #e6ebe4;">
      <label for="newNickname" style="margin-top: 0;">닉네임 변경 (쿨타임 3일)
        <div style="display: flex; gap: 8px; margin-top: 7px;">
          <input id="newNickname" type="text" minlength="1" maxlength="20" required placeholder="새 닉네임 (1~20자)" style="margin-top: 0; flex: 1;">
          <button id="nicknameSubmit" class="button" type="submit" style="white-space: nowrap;">닉네임 변경</button>
        </div>
        <small id="nicknameCooldownNote">닉네임은 변경 후 3일 동안 다시 바꿀 수 없습니다.</small>
      </label>
    </form>

    <div id="adminBox" class="actions" hidden><a class="button full" href="/admin.html">총괄관리자 콘솔 열기 →</a></div>
    <div id="logoutBox" class="actions" hidden><button id="cardLogout" class="button secondary full" type="button">로그아웃</button></div>
    <p id="message" class="message" role="status">계정을 확인하는 중…</p>
  </section></main>
  <script type="module" src="account.js?v=20261028b"></script>
</body>
</html>
