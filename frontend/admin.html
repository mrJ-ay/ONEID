<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONEID · 총괄관리자 콘솔</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">ONEID</a>
    <nav>
      <a href="/account.html">내 계정</a>
      <a href="https://oneid-helpdesk.onrender.com" target="_blank" rel="noopener">고객센터 관리</a>
      <a href="/admin.html" aria-current="page"><strong>총괄관리자</strong></a>
      <button id="logout" class="link-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main class="admin-wrap">
    <section class="admin-head">
      <div>
        <p class="eyebrow">SUPER ADMIN CONSOLE</p>
        <h1>ONEID 총괄관리자</h1>
        <p class="intro">통합 계정 권한, 이용 정지 및 계정 삭제를 관리합니다.</p>
      </div>
      <div class="admin-stats" id="stats" hidden>
        <div><strong id="statTotal">0</strong><span>전체 계정</span></div>
        <div><strong id="statAdmins">0</strong><span>관리자</span></div>
        <div><strong id="statSuspended">0</strong><span>정지됨</span></div>
      </div>
    </section>

    <p id="message" class="message" role="status">관리자 권한을 확인하는 중…</p>

    <section id="consoleBody" hidden>
      <div class="admin-toolbar">
        <input id="searchInput" type="search" placeholder="사용자명 또는 닉네임 검색…">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="chip active" data-filter="all">전체</button>
          <button type="button" class="chip" data-filter="admin">관리자</button>
          <button type="button" class="chip" data-filter="suspended">정지됨</button>
        </div>
        <button id="refreshBtn" type="button" class="button secondary small-btn">새로고침</button>
      </div>

      <div id="userList" class="user-list"></div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
